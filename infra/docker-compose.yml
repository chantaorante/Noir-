# NOIR production stack. Run from the repository root:
#   docker compose -f infra/docker-compose.yml --env-file .env up -d --build
name: noir

x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: local
    options: { max-size: "20m", max-file: "5" }

services:
  postgres:
    <<: *hardening
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: noir
      POSTGRES_USER: noir
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command: >
      postgres -c shared_buffers=1GB -c effective_cache_size=4GB -c work_mem=16MB
               -c maintenance_work_mem=256MB -c max_connections=60 -c wal_compression=on
               -c log_min_duration_statement=500 -c autovacuum_naptime=30s
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]            # no published ports: never reachable from the LAN/internet
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noir -d noir"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 3g

  app:
    <<: *hardening
    build: { context: .., dockerfile: infra/Dockerfile }
    image: noir-app:latest
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://noir:${POSTGRES_PASSWORD}@postgres:5432/noir
      PUBLIC_ORIGINS: ${PUBLIC_ORIGINS:?set PUBLIC_ORIGINS in .env}
      NOIR_DATA_KEY: ${NOIR_DATA_KEY:?set NOIR_DATA_KEY in .env}
      COOKIE_SECURE: "true"
      TRUST_PROXY: "true"
      LOG_LEVEL: info
      PORT: "3000"
    read_only: true
    tmpfs: ["/tmp:size=64m"]
    cap_drop: [ALL]
    user: "10001:10001"
    networks: [internal, edge]
    mem_limit: 1g
    pids_limit: 256

  caddy:
    <<: *hardening
    image: caddy:2-alpine
    depends_on: [app]
    ports:
      - "443:443"
      - "443:443/udp"
      - "80:80"
    environment:
      NOIR_HOSTNAME: ${NOIR_HOSTNAME:-noir.lan}
      NOIR_TLS: ${NOIR_TLS:-internal}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    networks: [edge]
    mem_limit: 256m

  # Optional remote access. Enable with: docker compose --profile tunnel up -d
  cloudflared:
    <<: *hardening
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN to use the tunnel profile}
    networks: [edge]
    mem_limit: 128m

networks:
  internal: { internal: true }
  edge: {}

volumes:
  pgdata:
  caddy_data:
  caddy_config:
